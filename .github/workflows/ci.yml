name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SheetFlow
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Generate synthetic order files
        run: python benchmarks/generate_orders.py --output-dir benchmarks/generated
      - name: Run the 30,900-row pipeline
        run: sheetflow run --config benchmarks/pipeline.json
      - name: Run the customer-order join
        run: sheetflow run --config benchmarks/join-pipeline.json
      - name: Verify append and join results
        run: python benchmarks/verify_benchmark.py
